# audiocafe.tokyo — PHP-FPM対応の恒久設定
# aruaru-easyweb UIがsites-available/audiocafe.tokyo.confを再生成しても、
# conf.d/はsites-enabled/より先にnginx.confでincludeされるため、
# 同じserver_nameを持つこちらが優先され、UI側の生成物は無視される。
#
# 2026-07-15: 443番のserver_nameブロックがこれまで存在しなかったため、
# HTTPSアクセス時はnginxのデフォルト443ブロック(aruaru.tokyo側の
# リダイレクト設定)にフォールバックし、audiocafe.tokyoへのアクセスが
# aruaru.tokyoへ強制的にリダイレクトされるバグがあった。Let's Encrypt
# の実証明書を新規発行し、専用の443ブロックを追加して解消。

server {
    listen      80;
    listen      [::]:80;
    server_name www.audiocafe.tokyo;

    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8103;
    }

    location / {
        return 301  https://audiocafe.tokyo$request_uri;
    }
}

server {
    listen      80;
    listen      [::]:80;
    server_name audiocafe.tokyo;

    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8103;
    }

    location / {
        return 301 https://audiocafe.tokyo$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name www.audiocafe.tokyo;
    ssl_certificate     /etc/letsencrypt/live/audiocafe.tokyo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audiocafe.tokyo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301  https://audiocafe.tokyo$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name audiocafe.tokyo;
    ssl_certificate     /etc/letsencrypt/live/audiocafe.tokyo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audiocafe.tokyo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript;

    access_log /var/log/nginx/audiocafe.tokyo_access.log;
    error_log  /var/log/nginx/audiocafe.tokyo_error.log warn;

    root  /var/www/audiocafe.tokyo;
    index index.php index.html;

    location ~ /\.(?:htaccess|git) {
        deny all;
    }

    # 2026-07-19: トップページ(完全一致 / のみ)をRust版へ切替。
    # location = は他のprefix location(/top/・/cancer/・/video/・
    # /Python/等の静的配信)より優先されるため、それらの既存パスは
    # 影響を受けず引き続きnginxが直接配信する。
    location = / {
        proxy_pass http://127.0.0.1:4400/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2026-07-17: PHPâRustç§»è¡ãã¬ãã¥ã¼ãæ¬çªã®PHPã¯ç¶ç¶ç¨¼åã
    location /rust-preview/ {
        proxy_pass http://127.0.0.1:4400/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2026-07-19: /aruaru/・/aruaru-lady/・/rakuten-mobile/ をRust版へ
    # 段階的カットオーバー(内容+見た目の一致検証済み、audiocafe-tokyo-rust
    # CLAUDE.md HANDOFF参照)。location / (トップページ他PHP全体)は
    # 未検証のため変更しない——この3パスのみの限定的な切替。
    location /aruaru/ {
        proxy_pass http://127.0.0.1:4400/aruaru;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /aruaru-lady/ {
        proxy_pass http://127.0.0.1:4400/aruaru-lady;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rakuten-mobile/ {
        proxy_pass http://127.0.0.1:4400/rakuten-mobile;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2026-08-04: /aruaru/・/aruaru-lady/・/rakuten-mobile/ 配下の多言語版
    # (index-*.php)はRust版へ未移植のため、正規表現locationでRustへの
    # prefixプロキシより優先させ、直接PHP-FPMへルーティングする
    # (audiocafe-tokyo-php CLAUDE.md 2026-08-04続きエントリ参照)。
    location ~ ^/(aruaru|aruaru-lady|rakuten-mobile)/index-[a-z-]+\.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location /summary {
        proxy_pass http://127.0.0.1:4400/summary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
