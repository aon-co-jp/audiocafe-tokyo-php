# aruaru.tokyo — Rust+Poem (aruaru-tokyo-server) へのリバースプロキシ。
# audiocafe.tokyoはPHPのまま、aruaru.tokyoはRust+Poemベースに変更(2026-07-15)。
# conf.d/はsites-enabled/より先にnginx.confでincludeされるため、
# aruaru-easyweb UI側の生成物より優先される。
#
# /aruaru/ ・/aruaru-lady/ ・/rakuten-mobile/ は audiocafe.tokyo 側の実体
# (PHP)へ内部プロキシするミラー。aruaru.tokyoからもクリックで閲覧できる
# ようにするための追加(2026-07-15、ユーザー報告のnot found対応)。

server {
    listen      80;
    listen      [::]:80;
    server_name aruaru.tokyo www.aruaru.tokyo;
    location /.well-known/acme-challenge/ { proxy_pass http://127.0.0.1:8103; }
    location / { return 301 https://aruaru.tokyo$request_uri; }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name www.aruaru.tokyo;
    ssl_certificate /etc/letsencrypt/live/aruaru.tokyo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aruaru.tokyo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name aruaru.tokyo;
    ssl_certificate /etc/letsencrypt/live/aruaru.tokyo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aruaru.tokyo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript;

    access_log /var/log/nginx/aruaru.tokyo_access.log;
    error_log  /var/log/nginx/aruaru.tokyo_error.log warn;

    location /aruaru/ {
        proxy_pass http://127.0.0.1:80/aruaru/;
        proxy_set_header Host audiocafe.tokyo;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /aruaru-lady/ {
        proxy_pass http://127.0.0.1:80/aruaru-lady/;
        proxy_set_header Host audiocafe.tokyo;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rakuten-mobile/ {
        proxy_pass http://127.0.0.1:80/rakuten-mobile/;
        proxy_set_header Host audiocafe.tokyo;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /video/7-percent.mp4 {
        alias "/root/aruaru.tokyo/video/7%.mp4";
        add_header Accept-Ranges bytes;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
